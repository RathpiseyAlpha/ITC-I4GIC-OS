<h2 style="font-family:'Ubuntu', 'Segoe UI', Arial, sans-serif;font-size:72px;font-weight:400;line-height:1.1">How a program finds its libraries</h2><div style="display:flex;gap:16px;align-items:center;justify-content:center"><div style="width:400px;background:#ffffff;border:1px solid #d3dcec;border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center"><p style="font-size:28px;font-weight:600;color:#1f5fd1;text-align:center">1. The kernel loads the program</p><p style="font-size:24px;color:#4a5b7a;text-align:center">an ELF file</p></div><x-shape kind="arrow-right" style="background:#1f5fd1;width:56px;height:28px"></x-shape><div style="width:400px;background:#ffffff;border:1px solid #d3dcec;border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center"><p style="font-size:28px;font-weight:600;color:#1f5fd1;text-align:center">2. The dynamic linker starts</p><p style="font-size:24px;color:#4a5b7a;text-align:center">ld-linux.so</p></div><x-shape kind="arrow-right" style="background:#1f5fd1;width:56px;height:28px"></x-shape><div style="width:400px;background:#1f5fd1;border:1px solid #d3dcec;border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center"><p style="font-size:28px;font-weight:600;color:#f1f4fa;text-align:center">3. It finds each .so</p><p style="font-size:24px;color:#f1f4fa;text-align:center">LD_LIBRARY_PATH, /etc/ld.so.cache, then /lib and /usr/lib</p></div><x-shape kind="arrow-right" style="background:#1f5fd1;width:56px;height:28px"></x-shape><div style="width:400px;background:#ffffff;border:1px solid #d3dcec;border-radius:16px;padding:24px 16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center"><p style="font-size:28px;font-weight:600;color:#1f5fd1;text-align:center">4. It maps them in</p><p style="font-size:24px;color:#4a5b7a;text-align:center">into the process, and the program runs</p></div></div>
