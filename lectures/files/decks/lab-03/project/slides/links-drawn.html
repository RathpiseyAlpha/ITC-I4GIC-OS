<section id="links-drawn" data-transition="fade" style="background:#f1f4fa;color:#0d1f3c;font-family:'Ubuntu', 'Segoe UI', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:flex-start;gap:24px">
<h2 style="font-family:'Ubuntu', 'Segoe UI', Arial, sans-serif;font-size:72px;font-weight:400;line-height:1.1">The two kinds of link, drawn</h2><svg xmlns="http://www.w3.org/2000/svg" aria-label="Hard link and symbolic link. A hard link: report1.txt and hard-demo.txt are two names for inode 12345, which has link count 2 and holds the data. A symbolic link: soft-demo.txt has its own inode, 99001, which stores the path report1.txt. That path is looked up as a name, which leads to inode 12345 and the data." viewBox="0 0 1800 540" width="1800" height="540" style="width:1800px;height:540px"><text x="450" y="44" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f5fd1">Hard link</text><text x="450" y="84" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">ln report1.txt hard-demo.txt</text><rect x="30" y="150" width="240" height="70" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="150" y="193" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">report1.txt</text><rect x="30" y="330" width="240" height="70" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="150" y="373" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">hard-demo.txt</text><rect x="350" y="230" width="310" height="110" rx="10" fill="#ffffff" stroke="#1f5fd1" stroke-width="3"/><text x="505" y="264" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#1b2a41">inode 12345</text><text x="505" y="298" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">link count 2</text><rect x="740" y="245" width="140" height="80" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="810" y="293" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">hello</text><line x1="270" y1="185" x2="334.8" y2="250.6" stroke="#1f5fd1" stroke-width="4"/><polygon points="346,262 340.5,245.0 329.1,256.2" fill="#1f5fd1"/><line x1="270" y1="365" x2="333.2" y2="317.6" stroke="#1f5fd1" stroke-width="4"/><polygon points="346,308 328.4,311.2 338.0,324.0" fill="#1f5fd1"/><line x1="660" y1="285" x2="720.0" y2="285.0" stroke="#1f5fd1" stroke-width="4"/><polygon points="736,285 720.0,277.0 720.0,293.0" fill="#1f5fd1"/><text x="450" y="470" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1b2a41">Two names for one inode.</text><text x="450" y="508" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" fill="#1b2a41">Remove one name and the data stays.</text><text x="1370" y="44" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f5fd1">Symbolic link</text><text x="1370" y="84" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">ln -s report1.txt soft-demo.txt</text><rect x="950" y="150" width="240" height="70" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="1070" y="193" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">soft-demo.txt</text><rect x="1270" y="140" width="310" height="110" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3" stroke-dasharray="8 6"/><text x="1425" y="174" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#1b2a41">inode 99001</text><text x="1425" y="208" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">stores report1.txt</text><rect x="950" y="330" width="240" height="70" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="1070" y="373" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">report1.txt</text><rect x="1270" y="320" width="310" height="110" rx="10" fill="#ffffff" stroke="#1f5fd1" stroke-width="3"/><text x="1425" y="354" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#1b2a41">inode 12345</text><text x="1425" y="388" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">link count 1</text><rect x="1660" y="335" width="140" height="80" rx="10" fill="#ffffff" stroke="#9db4d6" stroke-width="3"/><text x="1730" y="383" text-anchor="middle" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">hello</text><line x1="1190" y1="185" x2="1250.0" y2="185.0" stroke="#1f5fd1" stroke-width="4"/><polygon points="1266,185 1250.0,177.0 1250.0,193.0" fill="#1f5fd1"/><line x1="1190" y1="365" x2="1250.1" y2="372.9" stroke="#1f5fd1" stroke-width="4"/><polygon points="1266,375 1251.2,365.0 1249.1,380.8" fill="#1f5fd1"/><line x1="1580" y1="375" x2="1640.0" y2="375.0" stroke="#1f5fd1" stroke-width="4"/><polygon points="1656,375 1640.0,367.0 1640.0,383.0" fill="#1f5fd1"/><path d="M1425 250V290H1070V326" stroke="#c77d00" stroke-width="4" stroke-dasharray="10 7" fill="none"/><polygon points="1070,328 1062,312 1078,312" fill="#c77d00"/><text x="1090" y="282" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#c77d00">looks up that name</text><text x="1370" y="470" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1b2a41">Its own inode, storing a path.</text><text x="1370" y="508" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" fill="#1b2a41">Rename the target and the path breaks.</text><line x1="900" y1="120" x2="900" y2="520" stroke="#8d97aa" stroke-width="2" stroke-dasharray="4 8"/></svg><p style="font-size:32px;color:#4a5b7a">A hard link is a second name for the inode. A symbolic link is a separate small file that holds a name to look up.</p>
