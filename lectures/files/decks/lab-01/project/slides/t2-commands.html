<section id="t2-commands" data-transition="fade" style="background:#f1f4fa;color:#0d1f3c;font-family:'Ubuntu', 'Segoe UI', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:flex-start;gap:36px">
<h2 style="font-family:'Ubuntu', 'Segoe UI', Arial, sans-serif;font-size:72px;font-weight:400;line-height:1.1">The ten commands</h2><div style="display:flex;gap:32px;align-items:flex-start"><table style="width:936px;border-collapse:collapse"><tr><th style="text-align:left;font-size:28px;font-weight:600;color:#1f5fd1;padding:16px 24px;border-bottom:2px solid #0d1f3c;width:234px">Command</th><th style="text-align:left;font-size:28px;font-weight:600;color:#1f5fd1;padding:16px 24px;border-bottom:2px solid #0d1f3c;width:702px">Meaning</th></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">pwd</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Shows the folder you are in</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">ls</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Lists the files here</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">mkdir</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Makes a folder</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">cd</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Goes into a folder</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">touch</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Makes an empty file</td></tr></table><table style="width:936px;border-collapse:collapse"><tr><th style="text-align:left;font-size:28px;font-weight:600;color:#1f5fd1;padding:16px 24px;border-bottom:2px solid #0d1f3c;width:234px">Command</th><th style="text-align:left;font-size:28px;font-weight:600;color:#1f5fd1;padding:16px 24px;border-bottom:2px solid #0d1f3c;width:702px">Meaning</th></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">echo</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Prints text</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">cat</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Shows what is in a file</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">cp</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Copies a file</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">mv</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Moves or renames a file</td></tr><tr><td style="font-size:28px;font-weight:600;padding:16px 24px;border-bottom:1px solid #d3dcec"><span style="font-family:'Ubuntu Mono', 'Courier New', monospace">rm</span></td><td style="font-size:28px;padding:16px 24px;border-bottom:1px solid #d3dcec">Deletes a file</td></tr></table></div>
