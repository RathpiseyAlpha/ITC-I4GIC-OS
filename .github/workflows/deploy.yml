name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject environment config
        run: |
          cat > app/js/env.js << 'ENVEOF'
          window.__ENV = {
              serverUrl: '${{ secrets.PRESENCE_SERVER_URL }}',
              examRoom: true,   // the exam room and the exam board links in the portal menu
              practice: true    // the Practice Linux Commands links
          };
          ENVEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
