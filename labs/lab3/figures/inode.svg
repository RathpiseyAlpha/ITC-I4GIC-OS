<svg xmlns="http://www.w3.org/2000/svg" aria-label="What an inode looks like. The directory has a row for each file name with an inode number, for example report1.txt with 12345. Inode 12345 holds the mode, owner, size, timestamps, link count and the block where the data is. The data block holds the bytes of the file. The file name is not stored in the inode." viewBox="0 0 1800 570" width="1800" height="570" style="width:1800px;height:570px"><rect x="0" y="0" width="1800" height="570" fill="#ffffff"/><text x="270" y="44" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a41">The directory</text><text x="910" y="44" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a41">The inode</text><text x="1550" y="44" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b2a41">Data blocks on the disk</text><rect x="20" y="80" width="500" height="171" rx="12" fill="#eef3fb" stroke="#9db4d6" stroke-width="2"/><line x1="300" y1="80" x2="300" y2="251" stroke="#9db4d6" stroke-width="2"/><line x1="20" y1="137" x2="520" y2="137" stroke="#9db4d6" stroke-width="2"/><line x1="20" y1="194" x2="520" y2="194" stroke="#9db4d6" stroke-width="2"/><text x="40" y="118" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1b2a41">name</text><text x="320" y="118" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1b2a41">inode number</text><rect x="24" y="141" width="492" height="49" rx="8" fill="#1f5fbf" fill-opacity=".14" stroke="#1f5fbf" stroke-width="3"/><text x="40" y="175" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">report1.txt</text><text x="320" y="175" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#1b2a41">12345</text><text x="40" y="232" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">report2.txt</text><text x="320" y="232" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">12346</text><rect x="640" y="70" width="540" height="380" rx="14" fill="#eef3fb" stroke="#1f5fbf" stroke-width="3"/><path d="M640 130V84a14 14 0 0 1 14-14H1166a14 14 0 0 1 14 14V130Z" fill="#1f5fbf"/><text x="910" y="112" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">inode 12345</text><text x="668" y="166" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">mode</text><text x="890" y="166" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">-rw-r--r--</text><line x1="656" y1="183" x2="1164" y2="183" stroke="#9db4d6" stroke-width="1.5"/><text x="668" y="219" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">owner</text><text x="890" y="219" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">student</text><line x1="656" y1="236" x2="1164" y2="236" stroke="#9db4d6" stroke-width="1.5"/><text x="668" y="272" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">size</text><text x="890" y="272" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">4 bytes</text><line x1="656" y1="289" x2="1164" y2="289" stroke="#9db4d6" stroke-width="1.5"/><text x="668" y="325" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">times</text><text x="890" y="325" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">3 timestamps</text><line x1="656" y1="342" x2="1164" y2="342" stroke="#9db4d6" stroke-width="1.5"/><text x="668" y="378" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">link count</text><text x="890" y="378" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">1</text><line x1="656" y1="395" x2="1164" y2="395" stroke="#9db4d6" stroke-width="1.5"/><text x="668" y="431" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">data</text><text x="890" y="431" text-anchor="start" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" font-weight="700" fill="#1b2a41">block 8841</text><rect x="1340" y="180" width="420" height="72" rx="10" fill="#eef3fb" stroke="#1f5fbf" stroke-width="3"/><text x="1364" y="225" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">block 8841</text><text x="1736" y="225" text-anchor="end" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">hello</text><rect x="1340" y="276" width="420" height="72" rx="10" fill="none" stroke="#9db4d6" stroke-width="3" stroke-dasharray="8 6"/><text x="1364" y="321" text-anchor="start" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="24" fill="#1b2a41">block 8842</text><text x="1736" y="321" text-anchor="end" font-family="Ubuntu Mono, DejaVu Sans Mono, Consolas, monospace" font-size="24" fill="#1b2a41">(unused)</text><line x1="516" y1="165" x2="620.0" y2="165.0" stroke="#1f5fbf" stroke-width="4"/><polygon points="636,165 620.0,157.0 620.0,173.0" fill="#1f5fbf"/><line x1="1176" y1="409" x2="1325.8" y2="228.3" stroke="#1f5fbf" stroke-width="4"/><polygon points="1336,216 1319.6,223.2 1331.9,233.4" fill="#1f5fbf"/><text x="900" y="500" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" fill="#1b2a41">The directory maps a name to an inode number. The inode describes the file and says where its data is.</text><text x="900" y="540" text-anchor="middle" font-family="Ubuntu, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#c77d00">The name is not stored in the inode.</text></svg>
