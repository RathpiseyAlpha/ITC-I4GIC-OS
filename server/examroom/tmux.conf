# tmux settings for the exam room shell. tmux is only there so a reload or a dropped connection returns to the same
# shell; the student should not notice it. No prefix key (so no Ctrl+B surprises and nothing for SEB to block), no
# status line, a long history, and no delay after Escape.
set -g prefix None
unbind-key C-b
set -g status off
set -g history-limit 20000
set -g escape-time 0
set -g mouse off
set -g default-terminal "xterm-256color"
set -g aggressive-resize on
set -g set-titles off
set -g destroy-unattached off
set -g exit-empty on
